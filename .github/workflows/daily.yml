name: daily-collect

# 実ブラウザ(Playwright)でみんレポの反スクレイピング対策(_d2ロールCookie)を突破して収集する。
# 毎朝8時(JST)を主収集とし、みんレポの掲載遅れに備えて昼・夜にも補完実行(未取得日だけ取得=既取得は即スキップ)。
# 収集→X先読み→分析→ダッシュボード更新→自動commit。手動(workflow_dispatch)で日付/日数指定も可。
on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 JST 主収集
    - cron: "30 23 * * *"  # 08:30 JST 8時に未掲載だった分を再確認
    - cron: "0 4 * * *"    # 13:00 JST 遅延掲載の補完
    - cron: "0 11 * * *"   # 20:00 JST さらに補完
  workflow_dispatch:
    inputs:
      days:
        description: "遡って収集する日数(未取得のみ)。既定5"
        required: false
        default: "5"
      date:
        description: "収集する日 M/D(当年)。指定時はその日だけ"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python collect.py --date "${{ github.event.inputs.date }}"
          else
            python collect.py --days "${{ github.event.inputs.days || '5' }}"
          fi
      - name: Harvest X hints (best-effort)
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          python harvest_x.py "$TODAY" || true
      - name: Analyze & dashboard
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          python analyze.py || true
          python shima.py "$TODAY" || true
          python track.py daily "$TODAY" || true
          python build_dashboard.py || true
      - name: Commit
        run: |
          git config user.name  "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data reports predictions hints)" ]; then
            git add data reports predictions hints
            git commit -m "auto: $(date -u +%Y-%m-%d) collect+analyze"
            git push
          else
            echo "no new data"
          fi
