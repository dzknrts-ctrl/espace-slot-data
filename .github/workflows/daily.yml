name: daily-collect

# 実ブラウザ(Playwright)でみんレポの反スクレイピング対策(_d2ロールCookie)を突破して収集する。
# クラウド常設: 毎日 02:00 UTC(=11:00 JST)に前日分までを収集→分析→ダッシュボード更新→自動commit。
# push(コード変更時)でも起動して検証可能。手動(workflow_dispatch)で日付/日数指定も可。
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "遡って収集する日数(未取得のみ)。既定5"
        required: false
        default: "5"
      date:
        description: "収集する日 M/D(当年)。指定時はその日だけ"
        required: false
        default: ""
  push:
    paths:
      - "collect.py"
      - "analyze.py"
      - "build_dashboard.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python collect.py --date "${{ github.event.inputs.date }}"
          else
            python collect.py --days "${{ github.event.inputs.days || '5' }}"
          fi
      - name: Analyze & dashboard
        run: |
          python analyze.py || true
          python build_dashboard.py || true
      - name: Commit
        run: |
          git config user.name  "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data reports)" ]; then
            git add data reports
            git commit -m "auto: $(date -u +%Y-%m-%d) collect+analyze"
            git push
          else
            echo "no new data"
          fi
