name: daily-collect

# みんレポは2026-08に反スクレイピング対策(JSロールCookie＋レート制限)を導入したため、
# 収集は実ブラウザ(Playwright)で行う。クラウド(GitHub)の共有IPはブロック/throttleされ得るので、
# 日次の主エンジンはユーザーPCのタスクスケジューラ(run_daily.ps1, 家庭用IP)とする。
# このワークフローは手動(workflow_dispatch)のバックアップ用。日付指定も可。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "遡って収集する日数(未取得のみ)。既定5"
        required: false
        default: "5"
      date:
        description: "収集する日 M/D(当年)。指定時はその日だけ"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python collect.py --date "${{ github.event.inputs.date }}"
          else
            python collect.py --days "${{ github.event.inputs.days || '5' }}"
          fi
      - name: Analyze
        run: python analyze.py || true
      - name: Commit
        run: |
          git config user.name  "collector-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data reports)" ]; then
            git add data reports
            git commit -m "data: $(date -u +%Y-%m-%d) collect"
            git push
          else
            echo "no new data"
          fi
