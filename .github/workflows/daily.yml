name: daily-collect

# 毎朝 07:10 JST（=22:10 UTC）に前日分を収集。手動実行も可（日付指定可）。
on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "収集する日 M/D（当年）。空なら前日"
        required: false
        default: ""

permissions:
  contents: write   # data/ の追記コミットに必要

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Collect
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python collect.py --date "${{ github.event.inputs.date }}"
          else
            python collect.py
          fi

      - name: Commit data
        run: |
          git config user.name  "juggler-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "data: $(date -u +%Y-%m-%d) collect"
            git push
          else
            echo "no new data"
          fi
